# Publica el servidor de avisos en Cloudflare cada vez que cambia la carpeta server/.
name: Publicar servidor de avisos

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/servidor.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
